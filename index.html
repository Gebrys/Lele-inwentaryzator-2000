<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Inwentaryzator"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Inwentaryzator</title><style>
:root{--green:#123c2a;--green2:#1f6847;--bg:#f3f6f3;--white:#fff;--ink:#17251d;--muted:#66766c;--red:#c53929}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:var(--green);color:white;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}header h1{font-size:23px;margin:0}header p{margin:4px 0 0;opacity:.8;font-size:13px}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000b}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}button{border:0;border-radius:13px;padding:14px 12px;font-weight:700;font-size:15px;background:var(--green2);color:white;cursor:pointer}button.secondary{background:#e8f0eb;color:var(--green)}button.danger{background:#fff0ee;color:var(--red)}input{font:inherit;padding:13px;border:1px solid #d8e1da;border-radius:12px;width:100%;outline-color:var(--green2)}.label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.stats{display:flex;gap:12px}.stat{flex:1;background:#e8f0eb;border-radius:14px;padding:12px}.stat strong{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}video{width:100%;max-height:320px;background:#111;border-radius:14px;display:none;margin-top:12px}.scanner{position:relative}.scanOverlay{display:none;position:absolute;left:4%;right:4%;top:12%;bottom:12%;border:2px solid #22c55e;border-radius:12px;pointer-events:none;overflow:hidden}.scanOverlay.active{display:block}.scanLine{position:absolute;left:0;right:0;height:3px;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:scanMove 2s ease-in-out infinite alternate}@keyframes scanMove{from{top:8%}to{top:92%}}.scanTools{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.scanTools button{padding:10px 14px}.scanWrap{position:relative}.list{margin-top:8px}.item{padding:13px 0;border-bottom:1px solid #edf1ed;display:flex;gap:12px;align-items:center}.item:last-child{border:0}.item .info{flex:1;min-width:0}.ean{font-weight:700;overflow-wrap:anywhere}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:8px 10px}.qty .qtyBtn{font-size:20px;min-width:38px;min-height:40px;padding:6px 8px}.qtyInput{width:72px;min-width:72px;text-align:center;font-weight:800;padding:10px 5px;font-size:18px}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:22px}.hide{display:none!important}.searchBox{margin:10px 0}.scanConfirm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#16a34a;color:#fff;font-size:24px;font-weight:900;border-radius:14px;opacity:0;pointer-events:none;z-index:3;transition:opacity .15s}.scanConfirm.show{opacity:.92}.qty{gap:5px}.item .info{flex:1;min-width:0}.item .qty{flex-shrink:0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18251e;color:white;padding:12px 18px;border-radius:30px;opacity:0;transition:.2s;z-index:10}#toast.show{opacity:1}.topbtn{width:100%}.stat:nth-child(2){cursor:pointer;user-select:none}.eggModal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.eggModal.show{display:flex}.eggBox{background:#fff;border-radius:18px;max-width:520px;width:100%;overflow:hidden;position:relative}.eggBox img{display:block;width:100%;height:auto}.eggClose{position:absolute;right:10px;top:10px;border-radius:50%;width:42px;height:42px;padding:0;background:#222;color:white;font-size:24px}@media(min-width:600px){.row.actions button{min-height:56px}}
</style></head><body><header><h1>📦 Inwentaryzator</h1><p>Skanuj kody EAN • zapis lokalny • eksport CSV</p></header><main class="wrap"><section class="card"><div class="stats"><div class="stat"><strong id="itemsCount">0</strong><span>unikalne produkty</span></div><div class="stat"><strong id="totalQty">0</strong><span>łączna ilość</span></div></div></section><section class="card"><div class="row actions"><button id="startScan">📷 Skanuj kod</button><button class="secondary" id="stopScan">Zatrzymaj</button></div><div class="scanWrap"><video id="video" playsinline></video><div id="scanOverlay" class="scanOverlay"><div class="scanLine"></div></div><div id="scanConfirm" class="scanConfirm"></div></div><div class="scanTools"><button class="secondary hide" id="torchBtn">💡 Latarka</button></div><p id="scanStatus" class="small"></p></section><section class="card"><div class="label">WPROWADŹ EAN RĘCZNIE</div><div class="row"><input id="eanInput" inputmode="numeric" autocomplete="off" placeholder="Kod kreskowy EAN"><button id="addEan">Dodaj</button></div></section><section class="card"><div class="row" style="justify-content:space-between"><div class="label">LISTA SPISU</div><button class="secondary" id="undoBtn" disabled style="flex:0 0 auto">↶ Cofnij</button></div><input id="searchInput" class="searchBox" type="search" placeholder="Szukaj EAN…" inputmode="numeric" autocomplete="off"><div id="inventory" class="list"></div></section><section class="card"><div class="row"><button id="export">📤 Eksport CSV</button><button class="secondary" id="share">Udostępnij</button></div><div class="row" style="margin-top:10px"><button class="secondary" id="backup">💾 Backup</button><button class="secondary" id="restore">📂 Wczytaj backup</button><input id="backupFile" type="file" accept=".json,application/json" style="display:none"></div><div style="margin-top:10px"><button class="danger topbtn" id="clear">🗑️ Wyczyść spis</button></div></section><p class="small" style="text-align:center">Dane
